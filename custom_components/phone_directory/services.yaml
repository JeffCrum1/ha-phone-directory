publish:
  name: Publish Phone Directory
  description: Publish the phone directory to all configured outputs.

add_contact:
  name: Add Contact
  description: Add a contact to the phone directory.

  fields:
    name:
      name: Name
      description: Contact name.
      required: true
      example: Jane Smith - Cell
      selector:
        text:

    number:
      name: Phone Number
      description: Phone number without formatting.
      required: true
      example: "5551234567"
      selector:
        text:

change_contact:
  name: Change Contact
  description: Update an existing contact in the phone directory.

  fields:
    contact_id:
      name: Contact ID
      description: Unique ID of the contact to change.
      required: true
      example: 66834426-c28f-475f-8295-9029f931032c
      selector:
        text:

    name:
      name: Name
      description: Updated contact name.
      required: true
      example: Jane Smith - Mobile
      selector:
        text:

    number:
      name: Phone Number
      description: Updated phone number without formatting.
      required: true
      example: "5559876543"
      selector:
        text:

delete_contact:
  name: Delete Contact
  description: Remove a contact from the phone directory.

  fields:
    contact_id:
      name: Contact ID
      description: Unique ID of the contact to remove.
      required: true
      example: 66834426-c28f-475f-8295-9029f931032c
      selector:
        text:
